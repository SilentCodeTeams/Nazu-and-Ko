[workspace]
resolver = "2"
members = [
    "crates/nettool-proto",
    "crates/nettool-capture",
    "crates/nettool-proxy",
    "crates/nettoold",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["SilentStudio"]
repository = "https://github.com/silentstudio/nettool"

[profile.release]
lto = "thin"
codegen-units = 1
